name: Build Windows client

# Produces UniversalDownloader.exe (self-contained, single-file, win-x64)
# on every push that touches the client, plus on manual dispatch.
# Download it from the workflow run's "Artifacts" section.

on:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UniversalDownloader.sln

      - name: Test
        run: dotnet test tests/UniversalDownloader.Tests/UniversalDownloader.Tests.csproj -c Release --no-restore

      - name: Publish single-file exe
        run: >
          dotnet publish src/UniversalDownloader.App/UniversalDownloader.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:AssemblyName=UniversalDownloader
          -o publish

      - name: Upload UniversalDownloader.exe
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-win-x64
          path: client/publish/UniversalDownloader.exe
          if-no-files-found: error
