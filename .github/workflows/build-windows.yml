name: Build Windows client

# Produces UniversalDownloader.exe (self-contained, single-file, win-x64)
# on every push that touches the client, plus on manual dispatch.
# Download it from the workflow run's "Artifacts" section.

on:
  push:
    branches: [main, master]
    paths:
      - "client/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore UniversalDownloader.sln

      - name: Test
        run: dotnet test tests/UniversalDownloader.Tests/UniversalDownloader.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Report failed tests
        if: failure()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Recurse -Filter test-results.trx | Select-Object -First 1
          if ($null -eq $trx) { Write-Host "::error::No trx file produced"; exit 0 }
          [xml]$xml = Get-Content $trx.FullName
          $failed = @($xml.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' })
          Write-Host "::error::$($failed.Count) test(s) failed"
          foreach ($t in $failed) {
            $msg = ($t.Output.ErrorInfo.Message | Out-String).Trim().Substring(0, [Math]::Min(500, ($t.Output.ErrorInfo.Message | Out-String).Trim().Length))
            Write-Host "::error::FAILED TEST: $($t.testName) -- $msg"
          }

      - name: Publish single-file exe
        run: >
          dotnet publish src/UniversalDownloader.App/UniversalDownloader.App.csproj
          -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Rename exe to UniversalDownloader.exe
        run: Rename-Item publish/UniversalDownloader.App.exe publish/UniversalDownloader.exe

      - name: Upload UniversalDownloader.exe
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-win-x64
          path: client/publish/UniversalDownloader.exe
          if-no-files-found: error