name: Build Windows EXE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Universal Downloader
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore client/UniversalDownloader.sln

      - name: Run tests
        run: dotnet test client/tests/UniversalDownloader.Tests/UniversalDownloader.Tests.csproj --configuration Release --no-restore

      - name: Publish Windows x64 EXE
        run: >
          dotnet publish
          client/src/UniversalDownloader.App/UniversalDownloader.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o client/artifacts/publish

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "client/artifacts/publish/*" `
            -DestinationPath "UniversalDownloader-win-x64.zip" `
            -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalDownloader-Windows-x64
          path: UniversalDownloader-win-x64.zip
          if-no-files-found: error
          retention-days: 30